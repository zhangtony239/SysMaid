[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysmaid"
version = "0.7.10"
authors = [
  { name="Tony Zhang", email="zhangtony239@gmail.com" },
]
description = "For Windows powerusers: A Python-based DSL designed to easily discover and govern unruly background applications and services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "WMI",
    "pywin32",
    "psutil",
    "mss",
    "opencv-python"
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sysmaid"]
